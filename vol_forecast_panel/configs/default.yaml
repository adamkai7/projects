# 5-day realized-vol forecast on a fixed large-cap panel.
# This is a forecasting study, not a trading strategy.

data:
  # Extra history so a 756-day train can end in early 2015 and 2015-2017 can be OOS.
  start_date: "2012-01-01"
  end_date: null                  # null => today
  study_start: "2015-01-01"       # universe is frozen as of this date
  cache_dir: "data/cache"
  universe_path: "universe.txt"
  min_coverage: 0.90              # vs the common trading calendar
  max_gap_trading_days: 5         # drop names with a hole this long; do not interpolate
  min_rows: 1000

target:
  horizon: 5                      # RV_{t, t+5} = sqrt(sum_{i=1..5} r_{t+i}^2)

features:
  rv_windows: [1, 5, 22]
  volume_z_window: 22
  include_month_end: true         # calendar dummy; not a price leak

validation:
  train_days: 756                 # ~3y
  test_days: 126                  # ~6m
  step_days: 126                  # non-overlapping OOS blocks
  purge_days: 5                   # drop train rows whose 5-day labels overlap test features
  random_seed: 42

models:
  ridge_alphas: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
  rf_n_estimators: 100
  rf_max_depth: 6
  rf_min_samples_leaf: 1
